<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>x86 ASCII Converter</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
    input { width: 100%; padding: 10px; font-size: 18px; margin-bottom: 20px; background: #2d2d2d; color: #fff; border: 1px solid #555; }
    .output-group { margin-bottom: 15px; }
    label { font-weight: bold; color: #9cdcfe; display: block; margin-bottom: 5px; }
    .box { background: #000; padding: 10px; border-radius: 4px; border: 1px solid #333; min-height: 20px; word-wrap: break-word; }
  </style>
</head>
<body>
  <h2>ASCII Converter for emu8086</h2>
  
  <input type="text" id="charInput" placeholder="Type characters here (e.g., Hello)">

  <div class="output-group">
    <label>Hexadecimal (For MOV AL, ...h)</label>
    <div id="hexOutput" class="box"></div>
  </div>

  <div class="output-group">
    <label>Decimal</label>
    <div id="decOutput" class="box"></div>
  </div>

  <div class="output-group">
    <label>Binary</label>
    <div id="binOutput" class="box"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
