<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>x86 ASCII Converter</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
    textarea { 
      width: 100%; 
      height: 80px; 
      padding: 10px; 
      font-size: 16px; 
      margin-bottom: 20px; 
      background: #2d2d2d; 
      color: #fff; 
      border: 1px solid #555;
      resize: vertical;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #007acc; color: white; padding: 8px; }
    td { background: #252526; padding: 8px; border-bottom: 1px solid #333; }
    .special-char { color: #ce9178; font-weight: bold; }
  </style>
</head>
<body>
  <h2>x86 ASCII Converter</h2>
  
  <textarea id="charInput" placeholder="Type text, press Enter, Space, or Tab..."></textarea>

  <table>
    <thead>
      <tr>
        <th>Character</th>
        <th>Hex (MOV AL, ..h)</th>
        <th>Decimal</th>
        <th>Binary</th>
      </tr>
    </thead>
    <tbody id="outputBody">
      <!-- JavaScript will inject rows here -->
    </tbody>
  </table>

  <script src="renderer.js"></script>
</body>
</html>
